# Controles automáticos: corren en cada pull request a staging o a main, y cuando algo entra a esas ramas.
# Los nombres de los jobs (check y secretos) son los que se marcan como obligatorios en las reglas de las
# ramas (docs/CONFIGURACION-GITHUB.md, paso 3). Si cambian acá, cambian allá. El tercer control obligatorio,
# reglas-del-pull-request, está en reglas-del-pull-request.yml.
name: Controles automáticos

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

# Solo lectura: los controles no tocan el repo ni tienen secretos.
permissions:
  contents: read

concurrency:
  group: controles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Formato, reglas del código, tipos, tests, frenos y build
        run: npm run check

  secretos:
    name: secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks (versión fija, verificada)
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          archivo="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archivo" "$base/$archivo"
          curl -sSfL -o checksums.txt "$base/gitleaks_${VERSION}_checksums.txt"
          grep " ${archivo}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archivo" gitleaks
      - name: Buscar claves en toda la historia
        run: ./gitleaks git --redact --no-banner --verbose --config .gitleaks.toml .
