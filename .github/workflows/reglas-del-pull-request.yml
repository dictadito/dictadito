# Reglas del pull request: el título y las ramas. Corre también cuando se edita el pull request
# (por ejemplo, si se corrige el título), sin volver a correr los demás controles.
# El nombre del job (reglas-del-pull-request) es el que se marca como obligatorio en las reglas de las
# ramas (docs/CONFIGURACION-GITHUB.md, paso 3). Si cambia acá, cambia allá.
name: Reglas del pull request

on:
  pull_request:
    branches: [staging, main]
    types: [opened, edited, synchronize, reopened]

# Solo lectura: no toca el repo ni tiene secretos.
permissions:
  contents: read

concurrency:
  group: reglas-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reglas-del-pull-request:
    name: reglas-del-pull-request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 'Título con el formato "tipo: qué cambió"'
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITULO" | grep -Eq '^(feat|fix|docs|test|refactor|chore)(\([a-z0-9-]+\))?: .+'; then
            echo "Título OK: $TITULO"
          else
            echo "::error::El título tiene que ser 'tipo: qué cambió' (feat, fix, docs, test, refactor o chore). Es lo que queda como commit en staging. Ver docs/COMO-TRABAJAMOS.md."
            exit 1
          fi
      - name: A main solo desde staging, y ramas con nombre de tarea
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          RAMA: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$RAMA" != "staging" ]; then
            echo "::error::A main solo se llega desde staging. Este pull request sale de '$RAMA': cambiá la base a staging."
            exit 1
          fi
          if [ "$BASE" = "staging" ] && ! printf '%s' "$RAMA" | grep -Eq '^(feature|fix|chore|docs)/[a-z0-9][a-z0-9._-]*$'; then
            echo "::error::Las ramas de trabajo se llaman feature/, fix/, chore/ o docs/ más el tema, en minúscula y con guiones. Esta es '$RAMA'."
            exit 1
          fi
          echo "Ramas OK: $RAMA → $BASE"
